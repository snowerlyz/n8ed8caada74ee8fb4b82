<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>請輸入密碼</title>
<style>
:root{--paper:#f3f4f2;--sheet:#fff;--ink:#1c2230;--muted:#5d6577;--line:#d9dcd6;--accent:#28536b;--bad:#b0322b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#151920;--sheet:#1d222b;--ink:#e7e9ee;--muted:#a2a9b8;--line:#333a46;--accent:#8cc3dc;--bad:#f2918a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;display:grid;place-items:center;padding:16px}
form{width:100%;max-width:360px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
h1{font-size:1.15rem;margin:0}
p{margin:0;color:var(--muted);font-size:.9rem}
label{font-size:.85rem;color:var(--muted)}
input[type=password]{font:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:100%}
.row{display:flex;align-items:center;gap:8px;font-size:.88rem}
button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:10px;background:var(--accent);color:var(--sheet);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#msg{min-height:1.2em;color:var(--bad);font-size:.88rem}
</style>
</head>
<body>
<form id="f">
  <h1>這個頁面需要密碼</h1>
  <p>內容已加密，輸入密碼後才會在這台裝置上解開。</p>
  <label for="pw">密碼</label>
  <input type="password" id="pw" autocomplete="current-password" required autofocus>
  <label class="row" for="rm"><input type="checkbox" id="rm">在這台裝置記住密碼</label>
  <button type="submit" id="go">開啟</button>
  <div id="msg" role="status"></div>
</form>
